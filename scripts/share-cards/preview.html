<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat preview</title>
<!-- Proof only: a rough Discord-style embed and an iMessage-style bubble, each showing the card at 400px wide. -->
<style>
@font-face { font-family: Outfit; src: url("{{FONT}}/Outfit-400.woff2") format("woff2"); font-weight: 400; }
* { box-sizing: border-box; margin: 0; }
body { width: 460px; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #313338; color: #dbdee1; }
.discord { padding: 16px 14px 18px; }
.who { font-size: 14px; color: #f2f3f5; font-weight: 600; margin-bottom: 4px; }
.link { font-size: 14px; color: #00a8fc; margin-bottom: 8px; }
.embed { width: 432px; background: #2b2d31; border-left: 4px solid #c6dcc9; border-radius: 4px; padding: 10px 14px 14px 12px; }
.site { font-size: 12px; color: #b5bac1; }
.title { font-size: 15px; font-weight: 600; color: #00a8fc; margin: 6px 0 6px; }
.desc { font-size: 13.5px; line-height: 1.35; margin-bottom: 12px; }
.embed img { display: block; width: 400px; height: 210px; border-radius: 4px; }
.imessage { background: #fff; padding: 18px 14px 20px; }
.bubble { width: 400px; margin-left: auto; border-radius: 18px; overflow: hidden; background: #e9e9eb; }
.bubble img { display: block; width: 400px; height: 210px; }
.bubble p { padding: 8px 12px 10px; font-size: 14px; color: #111; line-height: 1.3; }
.bubble small { display: block; color: #6e6e73; font-size: 12.5px; }
</style></head>
<body>
<div class="discord"><div class="who">Owner</div><div class="link">{{URL}}</div>
<div class="embed"><div class="site">Veylet Studio</div><div class="title">{{TITLE}}</div><div class="desc">{{DESC}}</div><img src="{{IMAGE}}" alt=""></div></div>
<div class="imessage"><div class="bubble"><img src="{{IMAGE}}" alt=""><p>{{TITLE}}<small>veylet.com</small></p></div></div>
</body></html>
