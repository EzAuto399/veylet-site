<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Join your team — Veylet</title>
    <meta name="description" content="Accept an invite to a Veylet team." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="/media/studio-avatar.png" />
    <link rel="stylesheet" href="/style.css?v=a8e48561929d7ca9" />
    <style>
      .join-page h1:focus { outline: none; }
      .join-page .intro { max-width: 58ch; }
      .join-page[data-state="loading"] .intro { color: var(--muted); }
      .join-detail {
        max-width: 62ch;
        margin: 0 0 28px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .join-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .join-actions .button { min-height: 44px; }
      .join-actions .button[disabled] { opacity: 0.5; cursor: not-allowed; }
      .join-actions [hidden] { display: none; }
    </style>
    <script src="/brand-host.js?v=1c06a18e19b34007"></script>
    <script src="/supabase-public.js?v=b6fc53a3d04f45d1"></script>
    <script src="/vendor/supabase-js-2.116.0.min.js?v=84ee9bf45695c1dd"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="wrap">
      <a class="brand" href="/" aria-label="Veylet Studio home"
        ><span class="portal" aria-hidden="true"></span>VEYLET STUDIO</a
      >
      <nav aria-label="Main"><a href="/#process">How it works</a><a href="/offer">Offer</a><a href="/apply">Capture partners</a><a href="/account">Sign in</a></nav>
    </header>
    <!-- /join?i=<invite>: the link a workspace owner copies from "Your team" on their desk.
         dist/join/join.js takes the invite out of the address bar, keeps it on this
         device only until it is answered, signs the person in if needed (through
         /account?join=1, which comes back here) and accepts it. -->
    <main id="main" class="form-page wrap join-page" data-state="loading">
      <p class="eyebrow">Invitation</p>
      <h1 id="join-title" tabindex="-1">Checking your invite…</h1>
      <p class="intro" id="join-message" role="status" aria-live="polite">One moment.</p>
      <p class="join-detail" id="join-detail" hidden></p>
      <noscript>
        <p class="join-detail">Joining a team needs JavaScript. Turn it on for this site and open the invite link again.</p>
      </noscript>
      <div class="join-actions">
        <a class="button" id="join-primary" href="/account" hidden>Open your account</a>
        <button type="button" class="button" id="join-retry" hidden>Try again</button>
      </div>
    </main>
    <footer class="wrap"><a class="brand" href="/"><span class="portal" aria-hidden="true"></span>VEYLET STUDIO</a><p>Spaces people can understand.</p><nav aria-label="Footer"><a href="/waitlist">Join the waitlist</a><a href="/offer">Offer</a><a href="/start">Get started</a><a href="/website-guide">Website guide</a><a href="/guides">Guides</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></nav><span>© 2026 Veylet Studio</span></footer>
    <script defer src="/join/join.js?v=d681fcefdd148523"></script>
  </body>
</html>
