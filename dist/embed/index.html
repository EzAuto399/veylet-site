<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Walkthrough — Veylet</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="A Veylet walkthrough embedded in this page. Unlisted and not indexed."
    />
    <!-- Link preview card: one generic, static card for every shared walkthrough.
         No og:url, so the link's token is never repeated in the markup. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Property walkthrough" />
    <meta property="og:description" content="Walk through this property in 3D." />
    <meta property="og:image" content="https://veylet.com/media/walkthrough-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A line drawing of a room, with a path of stops leading to a doorway." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Property walkthrough" />
    <meta name="twitter:description" content="Walk through this property in 3D." />
    <meta name="twitter:image" content="https://veylet.com/media/walkthrough-card.png" />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="/media/studio-avatar.png" />
    <script src="/brand-host.js?v=1c06a18e19b34007"></script>
    <script src="/supabase-public.js?v=b6fc53a3d04f45d1"></script>
    <script src="/tour-player.js?v=549f8bcd3ac17352"></script>
    <script src="/client-page.js?v=009d0f4c4f5ddd9d"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10231d;
      }
      /* First-party faces, same origin as this document. An embed on someone
         else's page must never reach a third-party font or script host. */
      @font-face {
        font-family: Outfit;
        src: url("/media/Outfit-400.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Outfit;
        src: url("/media/Outfit-500.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      body {
        display: grid;
        grid-template: minmax(0, 1fr) / minmax(0, 1fr);
        overflow: hidden;
      }
      #tour-frame, #tour-stage, .embed-fallback {
        grid-area: 1 / 1;
        min-width: 0;
        min-height: 0;
      }
      /* A version 2 walkthrough draws here, in this page, from data files. */
      #tour-stage {
        width: 100%;
        height: 100%;
      }
      #tour-stage[hidden] {
        display: none;
      }
      #tour-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #10231d;
      }
      #tour-frame[hidden] {
        display: none;
      }
      .embed-fallback {
        box-sizing: border-box;
        height: 100%;
        overflow: auto;
        z-index: 1;
        display: flex;
        flex-direction: column;
        /* Anchored high on purpose. A builder element with a fixed height
           shorter than this iframe (Wix, agency listing templates) crops the
           bottom, and a centred block puts Explore inside the cropped band. */
        justify-content: flex-start;
        gap: 8px;
        padding: clamp(16px, 9vh, 40px) clamp(16px, 4vw, 32px);
        background: #10231d;
        color: #f4f1e9;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      .embed-fallback[hidden] {
        display: none;
      }
      .embed-fallback h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 24px);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .embed-fallback p {
        margin: 0;
        max-width: 46ch;
        color: rgba(244, 241, 233, 0.78);
        font-size: 15px;
        line-height: 1.4;
      }
      /* Who shared it, when the agent chose to show it. No contact buttons:
         the agent's own page already carries those. */
      .embed-fallback #embed-agent {
        margin-top: -4px;
        color: #f4f1e9;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      /* Two loading stages. While nothing is on screen the visitor gets the
         whole panel, because a near-black rectangle with one dim line in the
         corner reads as broken on a listing page. The instant the viewer owns
         the viewport we shrink to a compact notice: the canvas must remain
         visible while it produces its first frame, and nothing may cover it. */
      .embed-fallback[data-mode="preparing"] > :not(#embed-title):not(#embed-agent):not(#embed-status) { display: none; }
      .embed-fallback[data-mode="loading"] {
        padding: 12px;
        background: transparent;
        pointer-events: none;
      }
      .embed-fallback[data-mode="loading"] > :not(#embed-status) { display: none; }
      .embed-fallback[data-mode="loading"] #embed-status {
        align-self: flex-start;
        padding: 10px 14px;
        border-radius: 2px;
        background: #10231d;
      }
      #embed-status:empty { display: none; }
      [hidden] { display: none !important; }
      .embed-fallback button, .embed-fallback a { box-sizing: border-box; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 2px; font: 500 14px/20px "Outfit", ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
      .embed-fallback button { border: 1px solid #c6dcc9; background: #c6dcc9; color: #10231d; }
      .embed-fallback a { color: #f4f1e9; border: 1px solid #6f8474; text-decoration: none; }
      .embed-fallback button:focus-visible, .embed-fallback a:focus-visible { outline: 3px solid #c6dcc9; outline-offset: 4px; }
      .embed-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      /* Quiet on purpose: a small underlined line under the invitation, still a 44px target. */
      .embed-fallback a.embed-report { align-self: flex-start; justify-content: flex-start; padding: 0 2px; border: 0; color: rgba(244, 241, 233, 0.72); font-size: 13px; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
      @media (max-width: 380px), (max-height: 380px) { .embed-fallback { padding: 16px; } }
    </style>
  </head>
  <body>
    <main class="embed-fallback" id="embed-fallback">
      <h1 id="embed-title">Explore this property in 3D.</h1>
      <p id="embed-agent" hidden></p>
      <!-- True with and without JavaScript. The script adds the sentence about
           starting only once there is a control to start with. -->
      <p id="embed-body">Walk through the space at your own pace.</p>
      <p id="embed-status" role="status"></p>
      <div class="embed-actions">
        <button id="embed-start" type="button" hidden>Explore in 3D</button>
        <a id="embed-open" data-tour-dead-end target="_blank" rel="noopener noreferrer" hidden>Open in a new tab</a>
      </div>
      <div id="tour-actions" hidden><button id="tour-retry" type="button">Try again</button></div>
      <a id="embed-report" class="embed-report" target="_blank" rel="noopener noreferrer" hidden>Report this walkthrough</a>
      <noscript><p>This walkthrough needs JavaScript. Turn it on and reload the page, or ask the agent for the property's photographs and a viewing.</p></noscript>
    </main>
    <iframe
      id="tour-frame"
      title="Reconstructed walkthrough"
      allow="fullscreen *"
        allowfullscreen
      sandbox="allow-scripts allow-pointer-lock"
      referrerpolicy="no-referrer"
      hidden
    ></iframe>
    <div id="tour-stage" hidden></div>
    <script>
      (() => {
        const els = {
          title: document.getElementById('embed-title'),
          body: document.getElementById('embed-body'),
          status: document.getElementById('embed-status'),
          frame: document.getElementById('tour-frame'),
          stage: document.getElementById('tour-stage'),
        };
        const fallback = document.getElementById('embed-fallback');
        const start = document.getElementById('embed-start');
        const open = document.getElementById('embed-open');

        const token = new URLSearchParams(location.search).get('t') || '';
        // Views for the agent's desk: an embed's channel is embed unless its link
        // says otherwise, and the site framing it is named by hostname only.
        const beacon = token.length < 16 || !window.VeyletClientPage?.viewBeacon ? null : window.VeyletClientPage.viewBeacon({
          config: window.VEYLET_SUPABASE,
          token,
          src: window.VeyletClientPage.channelFrom(location.search, 'embed'),
          host: window.VeyletClientPage.referrerHost(document.referrer),
        });
        if (typeof window.VeyletPlayer === 'undefined') {
          els.title.textContent = 'This walkthrough is not available.';
          els.body.textContent =
            'The player files did not load on this device. Check the connection and reload.';
        } else if (token.length < 16) {
          window.VeyletPlayer.showFailure(
            { ...els, actions: null, retry: null },
            {
              heading: 'This walkthrough is not available.',
              body: 'The link on this page is incomplete. Ask the agent for the property’s walkthrough link.',
            }
          );
        } else {
          open.href = 'https://veylet.com/handoff?t=' + encodeURIComponent(token);
          // Report shows for any complete-looking token, whatever the lookup says.
          window.VeyletClientPage?.mountReport?.(document.getElementById('embed-report'), token);
          // The share is looked up (lookup_tour_share, one REST call) BEFORE Explore is
          // offered: a dead or unknown link reads as the handoff page does, with nothing
          // to press and no download. An error or no answer offers Explore as before:
          // starting looks the share up again and explains its own failure.
          const offer = () => { open.hidden = false; start.hidden = false; els.status.textContent = ''; };
          const dead = () => {
            start.hidden = true; open.hidden = true; els.status.textContent = '';
            els.title.textContent = 'This walkthrough isn’t available right now.';
            els.body.textContent = 'The agent may have turned it off or not shared it yet.';
          };
          const shareClient = window.VeyletClientPage?.restClient?.(window.VEYLET_SUPABASE) || null;
          if (shareClient) {
            els.status.textContent = 'Checking this walkthrough…';
            Promise.race([
              Promise.resolve(shareClient.rpc('lookup_tour_share', { p_token: token })),
              new Promise((resolve) => setTimeout(() => resolve(null), 8000)),
            ]).then((answer) => {
              if (!answer || answer.error) { offer(); return; }
              const row = Array.isArray(answer.data) ? answer.data[0] : answer.data;
              if (row && (row.storage_path || row.package_base_url)) offer(); else dead();
            }, offer);
          } else offer();
          // The agent's name under the invitation, when the server returns their
          // opt-in contact for this live link. No account SDK before Explore: a
          // page that already has it reuses it, otherwise one REST call. Any
          // error, or a backend without the function yet, leaves the line out.
          const page = window.VeyletClientPage;
          const agent = document.getElementById('embed-agent');
          if (page && agent) {
            const contactClient = window.supabase && window.supabase.createClient && window.VeyletPlayer.clientFor
              ? window.VeyletPlayer.clientFor({ persistSession: false, autoRefreshToken: false, detectSessionInUrl: false })
              : page.restClient(window.VEYLET_SUPABASE);
            page.lookupContact(contactClient, token).then((contact) => {
              if (!contact) return;
              agent.textContent = page.agentLine(contact);
              agent.hidden = false;
            });
          }
          // Only say what starting costs once there is something to press.
          els.body.textContent =
            'Walk through the space at your own pace. The walkthrough downloads when you start, so give it a moment on mobile data.';
          start.addEventListener('click', async () => {
            if (start.hidden) return;
            start.disabled = true;
            start.hidden = true;
            // Keep the whole panel while the viewport is still empty; drop to
            // the compact notice the moment the viewer is on screen.
            fallback.dataset.mode = 'preparing';
            await window.VeyletPlayer.boot({
            els,
            // On an iPhone (no element fullscreen) the fullscreen button opens the full page.
            fullscreenUrl: open.href,
            // A streamed walkthrough carries its own status line; a version 1
            // frame shares the viewport with the compact notice.
            onVisible: () => {
              if (els.stage && !els.stage.hidden) fallback.hidden = true;
              else fallback.dataset.mode = 'loading';
            },
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
            resolve: async (client) => {
              const { data, error } = await client.rpc('lookup_tour_share', {
                p_token: token,
              });
              const row = Array.isArray(data) ? data[0] : data;
              if (error) {
                throw new window.VeyletPlayer.TourFailure('share-unavailable', {
                  transient: true,
                });
              }
              if (!row || !row.storage_path) {
                throw new window.VeyletPlayer.TourFailure('share-not-found', {
                  transient: false,
                });
              }
              beacon?.opened(window);
              return {
                storagePath: row.storage_path,
                packageFormatVersion: row.package_format_version === 2 ? 2 : 1,
                packageBaseUrl: row.package_base_url || null,
                title: row.space_title || 'Shared space',
                intro: '',
              };
            },
            missingHeading: 'This walkthrough isn’t available right now.',
            missingBody: 'The agent may have turned it off or not shared it yet.',
            transientBody:
              'The walkthrough service did not answer. Check the connection and try again.',
          }).catch(() => window.VeyletPlayer.showFailure(
            { ...els, actions: document.getElementById('tour-actions'), retry: document.getElementById('tour-retry') },
            { body: 'The walkthrough could not start. Check the connection and try again.', retry: true }
          ));
            // A loading notice shares the viewport with the renderer; it must
            // never push the iframe below the visible agency embed. Restore the
            // full notice on a startup error. A visible frame owns its rendered
            // scene or photograph/error/retry UI; never cover it with a second notice.
            fallback.dataset.mode = 'notice';
            fallback.hidden = !(els.frame.hidden && (!els.stage || els.stage.hidden));
          }, { once: true });
        }
      })();
    </script>
  </body>
</html>
