<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Walkthrough — Veylet</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="A Veylet walkthrough embedded in this page. Unlisted and not indexed."
    />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="/media/studio-avatar.png" />
    <script src="/brand-host.js"></script>
    <script src="/supabase-public.js"></script>
    <script src="/vendor/supabase-js-2.116.0.min.js"></script>
    <script src="/vendor/jszip-3.10.2.min.js"></script>
    <script src="/tour-player.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10231d;
      }
      #tour-frame {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        background: #10231d;
      }
      #tour-frame[hidden] {
        display: none;
      }
      .embed-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 32px;
        color: #f2eee6;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      .embed-fallback[hidden] {
        display: none;
      }
      .embed-fallback .eyebrow {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f0a177;
      }
      .embed-fallback h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 500;
      }
      .embed-fallback p {
        margin: 0;
        max-width: 46ch;
        color: rgba(242, 238, 230, 0.78);
        font-size: 15px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main class="embed-fallback" id="embed-fallback">
      <p class="eyebrow">VEYLET WALKTHROUGH</p>
      <h1 id="embed-title">Private walkthrough</h1>
      <p id="embed-body">
        This walkthrough is unlisted and not indexed. It opens here whenever the
        operator's link is active.
      </p>
      <p id="embed-status" role="status"></p>
    </main>
    <iframe
      id="tour-frame"
      title="Reconstructed walkthrough"
      allow="fullscreen"
      hidden
    ></iframe>
    <script>
      (() => {
        const els = {
          title: document.getElementById('embed-title'),
          body: document.getElementById('embed-body'),
          status: document.getElementById('embed-status'),
          frame: document.getElementById('tour-frame'),
        };
        const fallback = document.getElementById('embed-fallback');

        const token = new URLSearchParams(location.search).get('t') || '';
        if (typeof window.VeyletPlayer === 'undefined') {
          els.title.textContent = 'This walkthrough is not available.';
          els.body.textContent =
            'The player files did not load on this device. Check the connection and reload.';
        } else if (token.length < 16) {
          window.VeyletPlayer.showFailure(
            { ...els, actions: null, retry: null },
            {
              heading: 'This walkthrough is not available.',
              body: 'The link is missing or incomplete. Ask the operator for a fresh embed code.',
            }
          );
        } else {
          window.VeyletPlayer.boot({
            els,
            auth: { persistSession: false, autoRefreshToken: false },
            resolve: async (client) => {
              const { data, error } = await client.rpc('lookup_tour_share', {
                p_token: token,
              });
              const row = Array.isArray(data) ? data[0] : data;
              if (error) {
                throw new window.VeyletPlayer.TourFailure('share-unavailable', {
                  transient: true,
                });
              }
              if (!row || !row.storage_path) {
                throw new window.VeyletPlayer.TourFailure('share-not-found', {
                  transient: false,
                });
              }
              return {
                storagePath: row.storage_path,
                title: row.space_title || 'Shared space',
                intro: '',
              };
            },
            missingHeading: 'This walkthrough is not available.',
            missingBody:
              'The link is missing, revoked, or the tour is not ready. Ask the operator for a fresh embed code.',
            transientBody:
              'The walkthrough service did not answer. Check the connection and try again.',
          }).then(() => {
            // The frame only replaces the notice once the package has loaded.
            if (fallback) fallback.hidden = !els.frame.hidden;
          });
        }
      })();
    </script>
  </body>
</html>
