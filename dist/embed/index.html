<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Walkthrough — Veylet</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="A Veylet walkthrough embedded in this page. Unlisted and not indexed."
    />
    <!-- Link preview card: one generic, static card for every shared walkthrough.
         No og:url, so the link's token is never repeated in the markup. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Property walkthrough" />
    <meta property="og:description" content="Look around this property in 3D, stop by stop." />
    <meta property="og:image" content="https://veylet.com/media/walkthrough-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A line drawing of a room, with a path of stops leading to a doorway." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Property walkthrough" />
    <meta name="twitter:description" content="Look around this property in 3D, stop by stop." />
    <meta name="twitter:image" content="https://veylet.com/media/walkthrough-card.png" />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="/media/favicon.svg" type="image/svg+xml" /><link rel="icon" href="/media/favicon-32.png" sizes="32x32" type="image/png" /><link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
    <!-- Time to poster: the lookup (account service) and the package's manifest and poster (tour host)
         connect while this page parses. Nothing of the player or 3D loads before Explore. -->
    <link rel="preconnect" href="https://ntupgokxauegrnnvacqt.supabase.co" crossorigin />
    <link rel="preconnect" href="https://tours.veylet.com" crossorigin />
    <link rel="preconnect" href="https://tours.veylet.com" />
    <script src="/brand-host.js?v=1c06a18e19b34007"></script>
    <script src="/supabase-public.js?v=67f9f1943ae2f979"></script>
    <script src="/tour-player.js?v=63bdaf6886b4df92"></script>
    <script src="/viewer-engagement.js?v=5b71cc315b651927"></script>
    <script src="/site-lib.js?v=3762aa68c924c230"></script>
    <script src="/client-page.js?v=ffa43a7ddf8903f6"></script>
    <script src="/tour-page.js?v=46f3970a34ac9122"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10231d;
      }
      /* First-party faces, same origin as this document. An embed on someone
         else's page must never reach a third-party font or script host. */
      @font-face {
        font-family: Outfit;
        src: url("/media/Outfit-400.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Outfit;
        src: url("/media/Outfit-500.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      body {
        display: grid;
        grid-template: minmax(0, 1fr) / minmax(0, 1fr);
        overflow: hidden;
      }
      #tour-frame, #tour-stage, .embed-fallback {
        grid-area: 1 / 1;
        min-width: 0;
        min-height: 0;
      }
      /* A version 2 walkthrough draws here, in this page, from data files. */
      #tour-stage {
        width: 100%;
        height: 100%;
      }
      #tour-stage[hidden] {
        display: none;
      }
      #tour-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #10231d;
      }
      #tour-frame[hidden] {
        display: none;
      }
      .embed-fallback {
        box-sizing: border-box;
        height: 100%;
        overflow: auto;
        touch-action: pan-y;
        z-index: 1;
        display: flex;
        flex-direction: column;
        /* Anchored high on purpose. A builder element with a fixed height
           shorter than this iframe (Wix, agency listing templates) crops the
           bottom, and a centred block puts Explore inside the cropped band. */
        justify-content: flex-start;
        /* A long word (a translated page, a long agency name) wraps instead of scrolling the frame sideways. */
        overflow-wrap: anywhere;
        gap: 8px;
        padding: clamp(16px, 9vh, 40px) clamp(16px, 4vw, 32px);
        background: #10231d;
        color: #f4f1e9;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      .embed-fallback[hidden] {
        display: none;
      }
      .embed-fallback h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 24px);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .embed-fallback p {
        margin: 0;
        max-width: 46ch;
        color: rgba(244, 241, 233, 0.78);
        font-size: 15px;
        line-height: 1.4;
      }
      /* Who shared it, when the agent chose to show it. No contact buttons:
         the agent's own page already carries those. */
      .embed-fallback #embed-agent {
        margin-top: -4px;
        color: #f4f1e9;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      /* Two loading stages. While nothing is on screen the visitor gets the
         whole panel, because a near-black rectangle with one dim line in the
         corner reads as broken on a listing page. The instant the viewer owns
         the viewport we shrink to a compact notice: the canvas must remain
         visible while it produces its first frame, and nothing may cover it. */
      .embed-fallback[data-mode="preparing"] > :not(#embed-title):not(#embed-agent):not(#embed-status) { display: none; }
      .embed-fallback[data-mode="loading"] {
        padding: 12px;
        background: transparent;
        pointer-events: none;
      }
      .embed-fallback[data-mode="loading"] > :not(#embed-status) { display: none; }
      .embed-fallback[data-mode="loading"] #embed-status {
        align-self: flex-start;
        padding: 10px 14px;
        border-radius: 2px;
        background: #10231d;
      }
      #embed-status:empty { display: none; }
      [hidden] { display: none !important; }
      .embed-fallback button, .embed-fallback a { box-sizing: border-box; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 2px; font: 500 14px/20px "Outfit", ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
      .embed-fallback button { border: 1px solid #c6dcc9; background: #c6dcc9; color: #10231d; }
      .embed-fallback a { color: #f4f1e9; border: 1px solid #6f8474; text-decoration: none; }
      .embed-fallback button:focus-visible, .embed-fallback a:focus-visible { outline: 3px solid #c6dcc9; outline-offset: 4px; }
      .embed-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      /* Quiet on purpose: a small underlined line under the invitation, still a 44px target. */
      .embed-fallback a.embed-report { align-self: flex-start; justify-content: flex-start; padding: 0 2px; border: 0; color: rgba(244, 241, 233, 0.72); font-size: 13px; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
      @media (max-width: 380px), (max-height: 380px) { .embed-fallback { padding: 16px; } }
      /* A 240 px slot: the invitation is its heading, who shared it, and one row with Explore, Open and
         Report. The sentence about downloading waits for a taller frame. */
      @media (max-height: 280px) {
        .embed-fallback[data-invite] { flex-flow: row wrap; align-content: flex-start; align-items: center; column-gap: 12px; padding: 12px 16px; }
        .embed-fallback[data-invite] > h1,
        .embed-fallback[data-invite] > p { flex: 0 0 100%; }
        .embed-fallback[data-invite] > h1 { font-size: 20px; }
        .embed-fallback[data-invite] #embed-body { display: none; }
        .embed-fallback[data-invite] a.embed-report { align-self: center; }
      }
      /* The walkthrough's own poster behind the invitation (the manifest's poster only; no 3D before Explore),
         darkened so the words stay readable. */
      .embed-fallback[data-poster="shown"] {
        /* From 78 % ink: over a white poster the heading reads 7.1 to 1 and the body text 5.1 to 1. */
        background: linear-gradient(rgba(16, 35, 29, 0.78), rgba(16, 35, 29, 0.9)), var(--embed-poster) center / cover no-repeat, #10231d;
      }
      .embed-fallback[data-poster="shown"][data-mode="loading"] { background: transparent; }
      html[data-theme="paper"],
      html[data-theme="paper"] body,
      html[data-theme="paper"] #tour-frame,
      html[data-theme="paper"] .embed-fallback {
        background: #f4f1e9;
        color: #10231d;
      }
      html[data-theme="paper"] .embed-fallback p {
        color: rgba(16, 35, 29, 0.8);
      }
      html[data-theme="paper"] .embed-fallback #embed-agent {
        color: #10231d;
      }
      html[data-theme="paper"] .embed-fallback[data-mode="loading"] {
        background: transparent;
      }
      html[data-theme="paper"] .embed-fallback[data-mode="loading"] #embed-status {
        background: #f4f1e9;
        color: #10231d;
        border: 1px solid rgba(16, 35, 29, 0.18);
      }
      html[data-theme="paper"] .embed-fallback button {
        border: 1px solid #10231d;
        background: #10231d;
        color: #f4f1e9;
      }
      html[data-theme="paper"] .embed-fallback a {
        color: #10231d;
        border: 1px solid rgba(16, 35, 29, 0.45);
      }
      html[data-theme="paper"] .embed-fallback button:focus-visible,
      html[data-theme="paper"] .embed-fallback a:focus-visible {
        outline: 3px solid #10231d;
        outline-offset: 4px;
      }
      html[data-theme="paper"] .embed-fallback a.embed-report {
        border: 0;
        color: rgba(16, 35, 29, 0.78);
      }
      html[data-theme="paper"] .embed-fallback[data-poster="shown"] {
        background: linear-gradient(rgba(244, 241, 233, 0.84), rgba(244, 241, 233, 0.94)), var(--embed-poster) center / cover no-repeat, #f4f1e9;
      }
      html[data-theme="paper"] .embed-fallback[data-poster="shown"][data-mode="loading"] {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="embed-fallback" id="embed-fallback">
      <h1 id="embed-title">Explore this property in 3D.</h1>
      <p id="embed-agent" hidden></p>
      <!-- True with and without JavaScript. The script adds the sentence about
           starting only once there is a control to start with. -->
      <p id="embed-body">Tap a numbered circle to move. Drag to look around.</p>
      <p id="embed-status" role="status"></p>
      <div class="embed-actions">
        <button id="embed-start" type="button" hidden>Explore in 3D</button>
        <a id="embed-open" data-tour-dead-end target="_blank" rel="noopener noreferrer" hidden>Open in a new tab</a>
      </div>
      <div id="tour-actions" hidden><button id="tour-retry" type="button">Try again</button></div>
      <a id="embed-report" class="embed-report" target="_blank" rel="noopener noreferrer" hidden>Report this walkthrough</a>
      <noscript><p>This walkthrough needs JavaScript. Turn it on and reload the page, or ask the agent for the property's photographs and a viewing.</p></noscript>
    </main>
    <iframe
      id="tour-frame"
      title="3D walkthrough"
      allow="fullscreen *"
        allowfullscreen
      sandbox="allow-scripts allow-pointer-lock"
      referrerpolicy="no-referrer"
      hidden
    ></iframe>
    <div id="tour-stage" hidden></div>
    <script>
      window.VeyletTourPage.embed();
    </script>
  </body>
</html>
