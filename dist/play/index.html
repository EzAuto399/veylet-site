<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Preview — Veylet</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="/media/studio-avatar.png" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/brand-host.js"></script>
    <script src="/supabase-public.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="wrap">
      <a class="brand" href="/" aria-label="Veylet Studio home"
        ><span class="portal" aria-hidden="true"></span>VEYLET STUDIO</a
      >
      <nav aria-label="Main">
        <a href="/account">Account</a>
      </nav>
    </header>
    <main id="main" class="form-page wrap">
      <p class="eyebrow">OWNER PREVIEW</p>
      <h1 id="play-title">Your walkthrough</h1>
      <p class="intro" id="play-body">
        Signed-in preview. Clients still need a private handoff link.
      </p>
      <p class="contact-note" id="play-status" role="status"></p>
      <iframe
        id="tour-frame"
        class="tour-frame"
        title="Reconstructed walkthrough"
        hidden
        allow="fullscreen"
      ></iframe>
    </main>
    <footer class="wrap">
      <a class="brand" href="/"
        ><span class="portal" aria-hidden="true"></span>VEYLET STUDIO</a
      >
    </footer>
    <script type="module" src="/play.js"></script>
  </body>
</html>
